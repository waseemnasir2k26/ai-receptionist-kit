[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-receptionist-kit"
version = "1.0.0"
description = "Generate and lint AI voice receptionist configs for Vapi, Retell and Bland. Trade presets, emergency escalation, offline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Waseem Nasir" }]
keywords = ["ai-receptionist", "voice-agent", "vapi", "retell", "bland", "linter", "n8n"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ai-receptionist-kit = "kit.cli:main"

[project.urls]
Homepage = "https://github.com/waseemnasir2k26/ai-receptionist-kit"

[tool.setuptools]
packages = ["kit", "kit.render", "kit.lint"]

[tool.setuptools.package-data]
kit = ["templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
