name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e . pytest
      - name: Tests
        run: python -m pytest -q
      - name: Smoke test the CLI
        run: |
          ai-receptionist-kit init --preset hvac --out /tmp/business.json
          ai-receptionist-kit build /tmp/business.json --platform all --out /tmp/dist
          ai-receptionist-kit lint /tmp/dist/vapi/assistant.json /tmp/dist/retell/assistant.json /tmp/dist/bland/assistant.json
          ai-receptionist-kit validate-n8n n8n/booking-webhook.json
      - name: Committed examples are up to date
        run: |
          python tests/regen_golden.py
          git diff --exit-code -- examples tests/golden
